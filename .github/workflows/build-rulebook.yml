name: Build Veiled Concord rulebook

on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2.zip.b64'
      - '.github/workflows/build-rulebook.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Stage 2 package
        run: |
          base64 -d stage2.zip.b64 > /tmp/Veiled_Concord_Rosterizer_Stage2.zip
          unzip -o /tmp/Veiled_Concord_Rosterizer_Stage2.zip Veiled_Concord.rulebook README.md AUDIT.txt -d .
      - name: Commit generated rulebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Veiled_Concord.rulebook README.md AUDIT.txt
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build Veiled Concord Rosterizer rulebook"
            git push
          fi
